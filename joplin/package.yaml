name: pinafore-lib-joplin
version: 0.1
author: Ashley Yakeley
copyright: (c) 2017-2024 Ashley Yakeley
license: GPL-2.0-only
license-file: LICENSE
maintainer: <ashley@semantic.org>

language: GHC2024
default-extensions:
  - AllowAmbiguousTypes
  - Arrows
  - DefaultSignatures
  - FunctionalDependencies
  - ImplicitParams
  - NoImplicitPrelude
  - OverloadedLabels
  - OverloadedStrings
  - PartialTypeSignatures
  - PatternSynonyms
  - QuantifiedConstraints
  - RecordWildCards
  - RecursiveDo
  - NoStarIsType
  - TemplateHaskell
  - TypeAbstractions
  - TypeFamilies
  - TypeFamilyDependencies
  - UndecidableInstances
  - UndecidableSuperClasses
  - ViewPatterns
ghc-options:
  - -Weverything
  - -Wno-missing-import-lists
  - -Wno-missing-export-lists
  - -Wno-unsafe
  - -Wno-missing-safe-haskell-mode
  - -Wno-missing-kind-signatures
  - -Wno-partial-type-signatures
  - -Wno-missing-role-annotations
  - -Wno-monomorphism-restriction
  - -Wno-missing-local-signatures
  - -Wno-partial-fields
  - -Wno-all-missed-specialisations # non-breaking
  - -Wno-missed-specialisations # non-breaking
  - -Wno-unused-packages # will catch threadtrace

library:
    source-dirs: src
    dependencies:
      - shapes
      - base
      - bytestring
      - tar
      - pinafore-language
      - pinafore-lib-media
    exposed-modules:
      - Pinafore.Library.Joplin
